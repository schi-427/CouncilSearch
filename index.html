<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Council Minutes Search</title>

  <!-- Vue.js via CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .result {
      margin: 1rem 0;
      padding: 1rem;
      border: 1px solid #ccc;
    }

    .filters {
      margin: 1rem 0;
      padding: 1rem;
      border: 1px solid #eee;
      background-color: #f9f9f9;
    }

    .filter-section {
      margin-bottom: 1rem;
    }

    .filter-section h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
      color: #333;
    }

    .filter-options {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-option input[type="checkbox"] {
      margin: 0;
    }

    .filter-option label {
      font-size: 0.9rem;
      cursor: pointer;
    }

    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    button:hover {
      background-color: #0056b3;
    }

    .clear-filters {
      background-color: #6c757d;
      margin-left: 1rem;
    }

    .clear-filters:hover {
      background-color: #545b62;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: min(95vw, 1000px);
      height: 80vh;
      max-height: 90vh;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
      resize: both;
      min-width: 400px;
      min-height: 400px;
    }

    .modal-close {
      margin-bottom: 0.75rem;
    }

    .result {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="app">
    <h1>Search Council Documents</h1>

    <!-- Document Type Filter -->
    <div class="filters">
      <div class="filter-section">
        <h3>Document Type</h3>
        <div class="filter-options">
          <div class="filter-option">
            <input type="checkbox" id="agendas" v-model="filters.documentTypes.agendas">
            <label for="agendas">Agendas</label>
          </div>
          <div class="filter-option">
            <input type="checkbox" id="minutes" v-model="filters.documentTypes.minutes">
            <label for="minutes">Minutes</label>
          </div>
          <div class="filter-option">
            <input type="checkbox" id="packets" v-model="filters.documentTypes.packets">
            <label for="packets">Packets</label>
          </div>
        </div>
      </div>

      <!-- Commission Filter -->
      <div class="filter-section">
        <h3>Commission</h3>
        <div class="filter-options">
          <div class="filter-option">
            <input type="checkbox" id="conway" v-model="filters.commissions.conway">
            <label for="conway">City Council</label>
          </div>

          <div class="filter-option">
            <input type="checkbox" id="cab" v-model="filters.commissions.cab">
            <label for="cab">Community Appearance Board</label>
          </div>
          <div class="filter-option">
            <input type="checkbox" id="kcb" v-model="filters.commissions.kcb">
            <label for="kcb">Keep Conway Beautiful</label>
          </div>
          <div class="filter-option">
            <input type="checkbox" id="bza" v-model="filters.commissions.bza">
            <label for="bza">Board of Zoning Appeals</label>
          </div>
          <div class="filter-option">
            <input type="checkbox" id="pc" v-model="filters.commissions.pc">
            <label for="pc">Planning Commission</label>
          </div>
          <div class="filter-option">
            <input type="checkbox" id="tree" v-model="filters.commissions.tree">
            <label for="tree">Tree Board</label>
          </div>
          <div class="filter-option">
            <input type="checkbox" id="water" v-model="filters.commissions.water">
            <label for="water">Water Quality and Drainage Commission</label>
          </div>
        </div>
      </div>

      <button @click="clearFilters" class="clear-filters">Clear All Filters</button>
    </div>

    <input type="text" v-model="query" placeholder="Enter search term..." @keyup.enter="search" />

    <button @click="search">Search Documents</button>
    <div v-if="loading">Searching Documents...</div>

    <div v-if="results.length > 0">
      <h2>Results</h2>
      <div v-for="result in results" :key="result.url" class="result" @click="openPdf(result.url)">
        <strong>{{ result.title }}</strong><br />
        <small>{{ result.commission }} · {{ result.documentType }}</small><br />
        Match found: {{ result.match }}
      </div>
    </div>

    <div v-if="searched && !loading">
      <h2>Results ({{ results.length }} match<span v-if="results.length !== 1">es</span>)</h2>
      <small>
        Searched {{filteredDocuments.length}} documents
      </small>
      <div v-if="results.length === 0">No matches found.</div>
    </div>
    <div v-if="showPdfModal" class="modal-backdrop" @click.self="closePdfModal">
      <div class="modal-content">
        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem;">
          <button class="modal-close" @click="closePdfModal">Close</button>

          <a v-if="selectedPdfPath" :href="selectedPdfPath" target="_blank" rel="noopener noreferrer">
            <button type="button">Open on City's Site</button>
          </a>
        </div>
        <iframe v-if="selectedPdfPath" :src="selectedPdfPath" width="100%" height="100%" style="border: none;">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      mounted() {
        fetch('public/search-index.json')
          .then(response => response.json())
          .then(data => {
            this.documents = data;
            console.log('Loaded documents:', this.documents);
          })
          .catch(error => {
            console.error('Error loading search-index:', error);
          });
      },
      data() {
        return {
          query: '',
          results: [],
          loading: false,
          searched: false,
          documents: [],
          showPdfModal: false,
          selectedPdfPath: '',
          filters: {
            documentTypes: {
              agendas: true,
              minutes: true,
              packets: true
            },
            commissions: {
              conway: true,
              cab: true,
              kcb: true,
              bza: true,
              pc: true,
              tree: true,
              water: true
            }
          }
        };
      },
      computed: {
        filteredDocuments() {
          return this.documents.filter(doc => {
            const documentTypeMatch =
              (this.filters.documentTypes.agendas && doc.documentType === 'Agenda') ||
              (this.filters.documentTypes.minutes && doc.documentType === 'Minutes') ||
              (this.filters.documentTypes.packets && doc.documentType === 'Packet');

            if (!documentTypeMatch) return false;

            const commissionMatch =
              (this.filters.commissions.conway && doc.commission === 'City Council') ||
              (this.filters.commissions.cab && doc.commission === 'Community Appearance Board') ||
              (this.filters.commissions.kcb && doc.commission === 'Keep Conway Beautiful') ||
              (this.filters.commissions.bza && doc.commission === 'Board of Zoning Appeals') ||
              (this.filters.commissions.pc && doc.commission === 'Planning Commission') ||
              (this.filters.commissions.tree && doc.commission === 'Tree Board') ||
              (this.filters.commissions.water && doc.commission === 'Water Quality and Drainage Commission');

            return commissionMatch;
          });
        }
      },
      methods: {
        clearFilters() {
          this.filters.documentTypes.agendas = true;
          this.filters.documentTypes.minutes = true;
          this.filters.documentTypes.packets = true;

          this.filters.commissions.conway = true;
          this.filters.commissions.cab = true;
          this.filters.commissions.kcb = true;
          this.filters.commissions.bza = true;
          this.filters.commissions.pc = true;
          this.filters.commissions.tree = true;
          this.filters.commissions.water = true;
        },
        search() {
          if (!this.query.trim()) return;

          this.loading = true;
          this.results = [];
          this.searched = true;

          const query = this.query.toLowerCase();

          this.results = this.filteredDocuments
            .filter(doc => (doc.text || '').toLowerCase().includes(query))
            .map(doc => ({
              title: doc.title,
              url: doc.url,
              commission: doc.commission,
              documentType: doc.documentType,
              match: this.getSnippet(doc.text, query),
              textSource: doc.textSource
            }));

          this.loading = false;
        },
        openPdf(path) {
          this.selectedPdfPath = path;
          this.showPdfModal = true;
        },
        closePdfModal() {
          this.showPdfModal = false;
          this.selectedPdfPath = '';
        },
        getSnippet(text, query) {
          if (!text) return '';

          const lowerText = text.toLowerCase();
          const index = lowerText.indexOf(query);

          if (index === -1) {
            return text.substring(0, 200) + '...';
          }

          const start = Math.max(0, index - 100);
          const end = Math.min(text.length, index + query.length + 100);

          return text.substring(start, end) + '...';
        },
      }
    }).mount('#app');
  </script>
</body>

</html>
