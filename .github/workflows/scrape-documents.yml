name: Scrape document links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # Every day at 8:00 AM

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Scrape Conway document links
        run: node scripts/scrape-doc-links.js

      - name: Extract PDF text
        run: node scripts/extract-pdf-text.js

      - name: Commit updated document list
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update scraped Conway document links
